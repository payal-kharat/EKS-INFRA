
trigger: none

parameters:
  - name: ENVIRONMENT
    displayName: Select Environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - uat
      - prod
  - name: ACTION
    displayName: Terraform Action
    type: string
    default: PLAN
    values:
      - PLAN
      - APPLY

pool:
  name: AWS-EKS-Agents

variables:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  ENVIRONMENT: ${{ parameters.ENVIRONMENT }}
  ACTION: ${{ parameters.ACTION }}
  TF_ROOT: '$(Build.SourcesDirectory)'

jobs:
  - job: TerraformPlan
    displayName: Terraform Plan
    timeoutInMinutes: 60
    steps:
      - checkout: self
        clean: true

      - script: |
          set -e
          terraform -version
          aws sts get-caller-identity
        displayName: Check Terraform and AWS Access
        workingDirectory: $(TF_ROOT)

      - script: |
          set -e
          terraform fmt -check -recursive
        displayName: Check Terraform Formatting
        workingDirectory: $(TF_ROOT)

      - script: |
          set -e
          BACKEND_CONFIG="backend_conf/backend_${ENVIRONMENT}.conf"
          TFVARS_FILE="${ENVIRONMENT}.tfvars"

          if [ ! -f "$BACKEND_CONFIG" ]; then
            echo "ERROR: Backend file not found: $BACKEND_CONFIG"
            exit 1
          fi

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "ERROR: Variables file not found: $TFVARS_FILE"
            exit 1
          fi

          terraform init -input=false -reconfigure -backend-config="$BACKEND_CONFIG"
          terraform validate
        displayName: Initialize and Validate Terraform
        workingDirectory: $(TF_ROOT)

      - script: |
          set -e
          TFVARS_FILE="${ENVIRONMENT}.tfvars"

          if [ "$ACTION" = "APPLY" ]; then
            mkdir -p "$(Build.ArtifactStagingDirectory)/terraform-plan"
            terraform plan -input=false -var-file="$TFVARS_FILE" -out="$(Build.ArtifactStagingDirectory)/terraform-plan/tfplan"
            terraform show -no-color "$(Build.ArtifactStagingDirectory)/terraform-plan/tfplan"
          else
            terraform plan -input=false -var-file="$TFVARS_FILE"
          fi
        displayName: Create Terraform Plan
        workingDirectory: $(TF_ROOT)

      - task: PublishPipelineArtifact@1
        displayName: Publish Terraform Plan
        condition: and(succeeded(), eq(variables['ACTION'], 'APPLY'))
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/terraform-plan'
          artifact: terraform-plan
          publishLocation: pipeline

  - job: ManualApproval
    displayName: Approve Terraform Changes
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['ACTION'], 'APPLY'))
    pool: server
    timeoutInMinutes: 1440
    steps:
      - task: ManualValidation@1
        timeoutInMinutes: 1440
        inputs:
          notifyUsers: 'YOUR_EMAIL@example.com'
          instructions: 'Review the Terraform plan carefully. Approve only if the planned changes are expected and will not unintentionally modify or destroy existing infrastructure.'
          onTimeout: reject

  - deployment: TerraformApply
    displayName: Apply Approved Terraform Plan
    dependsOn: ManualApproval
    condition: and(succeeded(), eq(variables['ACTION'], 'APPLY'))
    timeoutInMinutes: 60
    environment: aws-infra-${{ parameters.ENVIRONMENT }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: true

            - task: DownloadPipelineArtifact@2
              displayName: Download Terraform Plan
              inputs:
                buildType: current
                artifactName: terraform-plan
                targetPath: '$(Pipeline.Workspace)/terraform-plan'

            - script: |
                set -e
                BACKEND_CONFIG="backend_conf/backend_${ENVIRONMENT}.conf"

                terraform init -input=false -reconfigure -backend-config="$BACKEND_CONFIG"
              displayName: Initialize Terraform Backend
              workingDirectory: $(TF_ROOT)

            - script: |
                set -e
                PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"

                if [ ! -f "$PLAN_FILE" ]; then
                  echo "ERROR: Saved Terraform plan not found: $PLAN_FILE"
                  exit 1
                fi

                terraform apply -input=false "$PLAN_FILE"
              displayName: Apply Approved Terraform Plan
              workingDirectory: $(TF_ROOT)
