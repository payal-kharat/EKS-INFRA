
trigger: none

parameters:
  - name: ENVIRONMENT
    displayName: Select Environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - uat
      - prod
  - name: ACTION
    displayName: Terraform Action
    type: string
    default: PLAN
    values:
      - PLAN
      - APPLY
      - DESTROY

pool:
  name: AWS-EKS-Agents

variables:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  ENVIRONMENT: ${{ parameters.ENVIRONMENT }}
  ACTION: ${{ parameters.ACTION }}
  TF_ROOT: '$(Build.SourcesDirectory)'

jobs:
  - job: TerraformPlan
    displayName: Terraform Plan
    timeoutInMinutes: 60
    steps:
      - checkout: self
        clean: true

      - script: |
          set -e
          terraform -version
          aws sts get-caller-identity
        displayName: Check Terraform and AWS Access
        workingDirectory: $(TF_ROOT)

      - script: |
          set -e
          terraform fmt -check -recursive
        displayName: Check Terraform Formatting
        workingDirectory: $(TF_ROOT)

      - script: |
          set -e
          BACKEND_CONFIG="backend_conf/backend_${ENVIRONMENT}.conf"
          TFVARS_FILE="env/${ENVIRONMENT}.tfvars"

          if [ ! -f "$BACKEND_CONFIG" ]; then
            echo "ERROR: Backend file not found: $BACKEND_CONFIG"
            exit 1
          fi

          if [ ! -f "$TFVARS_FILE" ]; then
            echo "ERROR: Variables file not found: $TFVARS_FILE"
            exit 1
          fi

          terraform init -input=false -reconfigure -backend-config="$BACKEND_CONFIG"
          terraform validate
        displayName: Initialize and Validate Terraform
        workingDirectory: $(TF_ROOT)

      - script: |
          set -e
          TFVARS_FILE="env/${ENVIRONMENT}.tfvars"
          PLAN_DIR="$(Build.ArtifactStagingDirectory)/terraform-plan"
          mkdir -p "$PLAN_DIR"

          if [ "$ACTION" = "APPLY" ]; then
            terraform plan -input=false -var-file="$TFVARS_FILE" -out="$PLAN_DIR/tfplan"
            terraform show -no-color "$PLAN_DIR/tfplan"
          elif [ "$ACTION" = "DESTROY" ]; then
            echo "WARNING: Creating a DESTROY plan for environment: $ENVIRONMENT"
            terraform plan -destroy -input=false -var-file="$TFVARS_FILE" -out="$PLAN_DIR/tfplan"
            terraform show -no-color "$PLAN_DIR/tfplan"
          else
            terraform plan -input=false -var-file="$TFVARS_FILE"
          fi
        displayName: Create Terraform Plan
        workingDirectory: $(TF_ROOT)

      - task: PublishPipelineArtifact@1
        displayName: Publish Terraform Plan
        condition: and(succeeded(), or(eq(variables['ACTION'], 'APPLY'), eq(variables['ACTION'], 'DESTROY')))
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/terraform-plan'
          artifact: terraform-plan
          publishLocation: pipeline

  - job: ManualApproval
    displayName: Approve Terraform Action
    dependsOn: TerraformPlan
    condition: and(succeeded(), or(eq(variables['ACTION'], 'APPLY'), eq(variables['ACTION'], 'DESTROY')))
    pool: server
    timeoutInMinutes: 1440
    steps:
      - task: ManualValidation@1
        timeoutInMinutes: 1440
        inputs:
          notifyUsers: 'kharatpayal09@gmail.com'
          instructions: |
            Selected environment: $(ENVIRONMENT)
            Selected action: $(ACTION)

            Review the Terraform plan artifact before approving.

            For APPLY, verify that the planned changes are expected.

            For DESTROY, verify every resource marked for destruction.
            Confirm that the selected environment and Terraform backend are correct.
            Reject the approval if any infrastructure must be retained.

            Approving this validation allows the pipeline to execute the saved Terraform plan.
          onTimeout: reject

  - deployment: TerraformExecute
    displayName: Execute Approved Terraform Plan
    dependsOn: ManualApproval
    condition: and(succeeded(), or(eq(variables['ACTION'], 'APPLY'), eq(variables['ACTION'], 'DESTROY')))
    timeoutInMinutes: 120
    environment: aws-infra-${{ parameters.ENVIRONMENT }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: true

            - task: DownloadPipelineArtifact@2
              displayName: Download Terraform Plan
              inputs:
                buildType: current
                artifactName: terraform-plan
                targetPath: '$(Pipeline.Workspace)/terraform-plan'

            - script: |
                set -e
                BACKEND_CONFIG="backend_conf/backend_${ENVIRONMENT}.conf"

                terraform init -input=false -reconfigure -backend-config="$BACKEND_CONFIG"
              displayName: Initialize Terraform Backend
              workingDirectory: $(TF_ROOT)

            - script: |
                set -e
                PLAN_FILE="$(Pipeline.Workspace)/terraform-plan/tfplan"

                if [ ! -f "$PLAN_FILE" ]; then
                  echo "ERROR: Saved Terraform plan not found: $PLAN_FILE"
                  exit 1
                fi

                if [ "$ACTION" = "DESTROY" ]; then
                  echo "WARNING: DESTROYING infrastructure for environment: $ENVIRONMENT"
                else
                  echo "Applying approved Terraform plan to environment: $ENVIRONMENT"
                fi

                terraform apply -input=false "$PLAN_FILE"
              displayName: Execute Approved Terraform Plan
              workingDirectory: $(TF_ROOT)
